# Copy to .github/workflows/deploy.yml in your app's repo.
# The app repo needs a Dockerfile; the DOKKU_* secrets are written by "Sync apps"
# when the app is declared in apps.yml with `repo: owner/name`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push the image to ghcr.io

jobs:
  deploy:
    uses: YOUR-USER/vps-infra/.github/workflows/deploy-dokku.yml@main
    with:
      app: my-api # must match `name` in apps.yml
    secrets:
      DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
      DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
      DOKKU_KNOWN_HOSTS: ${{ secrets.DOKKU_KNOWN_HOSTS }}

name: Sync apps

# Applies apps.yml to the VPS on every change, or manually.
on:
  push:
    branches: [main]
    paths:
      - apps.yml
      - scripts/sync-apps.sh
      - .github/workflows/sync-apps.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  sync:
    # Skips quietly in forks/templates that have not been configured yet.
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Sync
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          DOKKU_DOMAIN: ${{ vars.DOKKU_DOMAIN }}
          DOKKU_CI_SSH_KEY: ${{ secrets.DOKKU_CI_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: scripts/sync-apps.sh

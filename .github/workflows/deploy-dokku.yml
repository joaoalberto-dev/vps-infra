name: Deploy to Dokku

# Reusable workflow: builds the image on GitHub, pushes it to ghcr.io and
# deploys it with `dokku git:from-image`. The VPS never builds anything.
# See examples/deploy.yml for how an app repo calls it.
on:
  workflow_call:
    inputs:
      app:
        description: Dokku app name (as declared in apps.yml)
        required: true
        type: string
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile (default <context>/Dockerfile)
        type: string
        default: ""
      image:
        description: Image name without tag (default ghcr.io/<owner>/<repo>)
        type: string
        default: ""
      platforms:
        description: Target platforms, e.g. linux/arm64 for ARM servers
        type: string
        default: linux/amd64
      build-args:
        description: Newline-separated build args
        type: string
        default: ""
    secrets:
      DOKKU_HOST:
        required: true
      DOKKU_SSH_KEY:
        required: true
      DOKKU_KNOWN_HOSTS:
        required: true
    outputs:
      image:
        description: Image reference that was deployed
        value: ${{ jobs.deploy.outputs.image }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          image="${IMAGE:-ghcr.io/$GITHUB_REPOSITORY}"
          echo "ref=${image,,}:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DOKKU_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DOKKU_HOST }}
          APP: ${{ inputs.app }}
          REF: ${{ steps.image.outputs.ref }}
        run: ssh "dokku@$HOST" -- git:from-image "$APP" "$REF"

      - name: Enable HTTPS (first deploy)
        env:
          HOST: ${{ secrets.DOKKU_HOST }}
          APP: ${{ inputs.app }}
        run: |
          if [[ "$(ssh "dokku@$HOST" -- letsencrypt:active "$APP" | xargs)" != "true" ]]; then
            ssh "dokku@$HOST" -- letsencrypt:enable "$APP"
          fi
